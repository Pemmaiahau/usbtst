# Manual GitHub Pages deploy (optional; the live site is on Cloudflare). Scans the market, builds the static site and publishes it to GitHub Pages (free).
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
name: Scan and deploy

on:
  workflow_dispatch:
  # Manual only: the scheduled refresh runs through Cloudflare (cloudflare-refresh.yml).

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run scan
      - run: npm run check
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
